# /etc/nginx/sites-available/brightbyte

# HTTPS
server {
    listen 443 ssl;
    server_name brightbyte.zacharystocks.com;

    # Use the same two include lines as your other zacharystocks.com sites.
    include snippets/ssl.conf;
    include snippets/security-headers.conf;

    # The sign's long-lived WebSocket (used from Phase 5).
    location /device {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Firmware uploads are about 1 MB, just over Nginx's default limit.
    location = /api/firmware {
        client_max_body_size 4m;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name brightbyte.zacharystocks.com;

    return 301 https://$host$request_uri;
}
